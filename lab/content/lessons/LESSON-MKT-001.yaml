spec_version: "0.1"
lesson_id: LESSON-MKT-001
version: 0.2.0
title: 一条谣言如何演化为市场恐慌？
duration_minutes: 45
primary_courses:
  - {code: "107349", name: 金融机构与金融市场, level: undergraduate}
  - {code: "214822", name: 金融机构与金融市场, level: graduate}
related_courses:
  - {code: "107429", name: 投资学, level: undergraduate}
  - {code: "108272", name: 博弈论与信息经济学, level: undergraduate}
objectives:
  - 能从成交价格追溯到实际订单与成交记录
  - 能沿传播—情绪—决策—订单链解释恐慌如何进入市场，并用配对对照描述差异
  - 能区分交易暂停与风险消失，并指出至少一项模型限制
scenarios: [EXP-01, EXP-05, EXP-06, EXP-07]
stages:
  - name: 情境导入
    start_min: 0
    end_min: 5
    teacher: 说明事件为教学模拟，展示研究问题
    student: 提交对价格、流动性、情绪变化的预测
  - name: 基准实验
    start_min: 5
    end_min: 13
    teacher: 运行 EXP-01，解释价格来自撮合
    student: 识别成交价、未成交订单和沿用最后成交价的规则
    scenario_id: EXP-01
    groups: [A]
  - name: 恐慌冲击
    start_min: 13
    end_min: 23
    teacher: 切换 EXP-05，展示事件和传播网络
    student: 记录感染、行为、价量变化并解释
    scenario_id: EXP-05
    groups: [A, B]
  - name: 网络对照
    start_min: 23
    end_min: 31
    teacher: 调用 EXP-06，比较小世界、环形与无边网络
    student: 比较路径，不把某一条曲线当作普遍定律
    scenario_id: EXP-06
    groups: [SW, RG, EM]
  - name: 停牌干预
    start_min: 31
    end_min: 38
    teacher: 运行 EXP-07，展示停复牌时序
    student: 说明"交易暂停"与"风险消失"的区别
    scenario_id: EXP-07
    groups: [B, C]
  - name: 总结与反馈
    start_min: 38
    end_min: 45
    teacher: 打开证据卡与工作纸，组织讨论
    student: 提交三条证据、一条模型限制、一项新实验方案
worksheet:
  - {id: Q1, text: 观察到的价格变化，能够对应到哪些实际订单或成交记录？, rubric_dimension: 证据推理}
  - {id: Q2, text: 实验中恐慌的传播是否一定意味着每个投资者卖出？为什么？, rubric_dimension: 概念准确}
  - {id: Q3, text: 停牌后没有成交，是否说明市场中不存在负面预期？, rubric_dimension: 证据推理}
  - {id: Q4, text: 如果更换种子或网络结构，结论还稳定吗？, rubric_dimension: 实验设计}
  - {id: Q5, text: 列出至少一项模型无法代表真实 A 股市场的关键约束。, rubric_dimension: 模型边界}
# rubric omitted: plan appendix C default (lab.specs.DEFAULT_RUBRIC)
level_tasks:
  - level: undergraduate
    knowledge: 描述价格来自撮合、恐慌如何进入决策、停牌的含义，并提出预测
    design: 在给定的 A/B/C 组与三种网络之间比较
    evidence: 解释一张图与一名投资者的交易链
    deliverable: 课堂工作纸：三条证据、一条模型限制、一项新实验方案
  - level: graduate
    knowledge: 明确每个环节的机制假设，区分外生冲击、内生传播与机械效应
    design: 为课后作业设计一个因素实验（如恐慌种子数 × 停牌时长），预先指定结果指标
    evidence: 多种子分布与配对差异，包括零差异和方向不一致的结果
    deliverable: 研究性实验报告与可复现材料（manifest、配置、run_id）
guidance:
  prediction: 恐慌冲击后价格、流动性和情绪会怎样变化？停牌能停止恐慌吗？
  steps:
    - 课前在场景实验室预运行 EXP-01、EXP-05、EXP-06、EXP-07，并校验归档
    - 每个阶段先让学生写预测，再打开对照分析
    - 每个实验至少展示一次逐笔追溯和一次配对差异表
    - 最后导出证据报告作为讨论材料
  probes:
    - 价格平坦的那几步，是没有风险还是没有成交？
    - EXP-05 中恐慌几乎不扩散，EXP-06 中却扩散了：两者的传播系数有什么不同？
    - 换一组种子，结论还成立吗？
  negative_results: EXP-05 使用默认传播系数 beta=0.3，恐慌几乎不扩散；EXP-06 公开地把 beta 提高到 1.0，传播被激活后网络结构才影响覆盖人数，但对价格影响仍很小。课堂应把“传播是否发生取决于传播强度”作为讨论点，而不是把两段结果直接对比
interpretation_rules:
  - 不要求价格必然下跌；模型结果与预测不一致不扣分，能以证据解释即可
  - 停牌导致的平坦价格曲线不代表波动风险下降；同时展示零成交与订单状态
  - 没有成交时显示"沿用最后成交价"
  - 组间固定总步数、人口与初始市场参数；以相同 seed 成对比较，并用不同 seed 复核稳健性
mechanism_boundary: >-
  本课以"谣言"为教学叙事，但实验施加的是抽象 panic 种子冲击与 SIRS 状态传播；
  尚未证明可以从任意谣言文本可靠地生成语义信念变化。文本真假辨别、辟谣与可信度机制属于 P2 扩展。
review: {status: pending_teacher_review}
