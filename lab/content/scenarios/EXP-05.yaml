spec_version: "0.1"
scenario_id: EXP-05
version: 0.1.0
title: 谣言/恐慌会产生怎样的群体反应？
module: E2
phase: P1
course_codes: ["107349", "214822", "107429", "108272"]
levels: [undergraduate, graduate]
question: 恐慌信息进入投资者网络后，如何改变交易决策、成交与价格？
objectives:
  - 能沿"恐慌种子 → SIRS 传播 → 情绪 → 决策 → 订单 → 成交 → 价格"追溯一条机制链
  - 能用配对种子的 A/B 差异描述模型条件下的反应，而不是套用"必定暴跌"的结论
  - 能指出抽象 panic 冲击与真实谣言文本之间的差距
assumptions:
  - 64 个合成投资者，单资产、离散步连续撮合，T+0，无卖空、无融资
  - 恐慌以抽象 panic 种子人数注入，再由 SIRS 在小世界网络中传播
  - 向量行为公式沿用标准模型默认参数，未针对真实投资者校准
limitations:
  - P1 施加的是抽象 panic 种子冲击，不是从谣言文本推导出的信念变化；文本真假、辟谣与可信度属于 P2 扩展
  - 配对种子保证两组初始世界相同；事件发生后随机数消耗不同，差异同时包含机制与随机路径
  - 结果只代表该模型、参数与种子集合，不是对真实 A 股的预测或投资建议
evidence:
  - 感染/情绪状态随时间变化（infected、mean_sentiment）
  - 卖出决策与订单提交、拒绝的变化
  - 价格与成交量路径；无成交步沿用最后成交价
world:
  type: single_asset_orderbook
  agents: 64
  steps: 30
  initial_price: 3000.0
  decision_mode: vectorized
  social: {topology: small_world, neighbors: 6}
comparison:
  pairing: matched_seed
  seeds: [41, 42, 43, 44, 45]
  reference_group: A
  groups:
    - id: A
      label: 基准组
      description: 不施加事件
      events: []
    - id: B
      label: 恐慌组
      description: 第 8 步注入 8 个恐慌种子
      events:
        - {step: 8, kind: panic, value: 8, note: 教学叙事中的"谣言"在模型中编码为抽象恐慌种子}
observables: [price, volume, infected, sentiment, decisions, orders, sirs]
outcome:
  primary: sell_decision_rate
  secondary: [max_drawdown, cumulative_volume, peak_infected, final_return]
source_policy: {required_origin: simulation, allow_teaching_example_as_run: false}
approval: {require_teacher_confirmation: true}
review: {status: pending_teacher_review}
