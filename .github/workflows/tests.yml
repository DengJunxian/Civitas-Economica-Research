name: offline-engineering-tests
on: [push, pull_request]
jobs:
  headless-readme:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-core.txt
      - run: python -m pip check
      - run: python scripts/verify_minimal_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-${{ matrix.python }}
          path: outputs/clean-validation/
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt pybind11 setuptools
      - run: python setup.py build_ext --inplace
      - run: python -m pytest -q --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.python }}
          path: pytest.xml

  s6-offline-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.txt
      # A controlled synthetic world with only deterministic baseline agents.
      # No provider credentials, external market feeds, or paid API requests.
      - run: python -m scripts.run_s6_offline_pilot --output outputs/s6-offline-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s6-offline-controls
          path: outputs/s6-offline-ci/

  s61-liquidity-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.txt
      # Deliberately small: engineering code path check, not market evidence.
      - run: |
          python -m research.civitas_agent.liquidity_sweep \
            --ttls 1,3 --seeds 41 --agents 12 --steps 8 \
            --output outputs/s61-liquidity-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s61-liquidity-smoke
          path: outputs/s61-liquidity-smoke/

  s61-liquidity-development:
    needs: [tests, s61-liquidity-smoke]
    if: github.event_name == 'pull_request' && github.head_ref == 'research/civitas-agent-s61-liquidity-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-core.txt
      # Development-only, paired, zero-provider study; never touches heldout seeds.
      - run: |
          python -m research.civitas_agent.liquidity_sweep \
            --ttls 1,3,8 --seeds 41,42 --agents 64 --steps 60 \
            --output outputs/s61-liquidity-development
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s61-liquidity-development
          path: outputs/s61-liquidity-development/
